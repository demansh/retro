<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="{{ site.theme_color }}">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>{% if page.title %}{{ page.title }} :: {% endif %}{{ site.title }}</title>
  <link rel="preload" href="{{ '/assets/fonts/vt323.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/icons/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">
</head>
<body class="{{ page.body_class | default: 'menu-page' }}" data-home="{{ '/' | relative_url }}">
  {{ content }}
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("{{ '/sw.js' | relative_url }}")
          .catch((error) => console.error("Service worker registration failed", error));
      });
    }
  </script>
</body>
</html>
